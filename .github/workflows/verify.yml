name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up the pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.300

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify development assets and solution
        shell: pwsh
        run: ./tools/verify.ps1 -Profile full

      - name: Retain verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: artifacts/verification/
